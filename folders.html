<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>收藏夹 · 雪哔</title>
<meta name="description" content="雪哔 BILITIME：选择一个 B 站收藏夹，计算分 P 时长与报价，或进入 reaction 点播简报编辑器。">
<meta name="keywords" content="雪哔,SnawCap,BILITIME,B站收藏夹,时长统计,收藏夹管理,reaction,点播">
<meta name="author" content="山顶小雪球（SnawCap）">
<meta name="theme-color" content="#518ff4">
<link rel="icon" type="image/svg+xml" href="./assets/brand/favicon-brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="./css/theme.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/entry.css">
<link rel="stylesheet" href="./css/editor.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body data-page="folders">

<!-- 顶部导航（与主页一致；点击品牌回主页） -->
<header class="XNavBar scrolled" id="navBar">
  <div class="container">
    <div class="XNavBar-left">
      <button class="nav-brand" id="nav-home" type="button">
        <img src="./assets/brand/logo-brand.svg" alt="雪哔">
        <span>雪哔</span>
        <span class="nav-sub">BILITIME</span>
      </button>
    </div>
    <div class="XNavBar-right">
      <div class="nav-links">
        <button class="link-btn" id="btn-about" type="button">关于</button>
      </div>
      <button class="XSwitch" id="theme-switch" type="button" role="switch" title="切换到深色模式" aria-checked="false">
        <span class="check">
          <span class="icon">
            <span class="Xi-sun sun"></span>
            <span class="Xi-moon moon"></span>
          </span>
        </span>
      </button>
    </div>
  </div>
  <div class="DividingLine"></div>
</header>

<div class="ambient" aria-hidden="true">
  <div class="ambient__aurora"><div class="ambient__layer"><div class="ambient__mv"><div class="ambient__drift"></div></div></div></div>
  <div class="ambient__glow"></div>
  <div class="ambient__noise"></div>
</div>

<!-- ═══════════ 收藏夹列表 ═══════════ -->
<section class="stage active" id="stage-favs">
  <div class="container favs">
    <div class="favs-top">
      <button class="back-link" id="btn-re-uid"><span data-ic="chevL"></span>换一个 UID</button>
    </div>
    <header class="favs-head">
      <div>
        <p class="overline">STEP 02 · FAVORITES</p>
        <h2>选择一本收藏夹</h2>
        <p class="hint-line" id="favs-mode-hint">LIVE · 数据来自公开收藏夹 · 点击卡片查看时长统计与计价 · 点「写简报」进入编辑</p>
      </div>
      <div class="user-chip" id="fav-user"></div>
    </header>
    <div class="folder-grid" id="folder-list" aria-live="polite"></div>
  </div>
</section>

<div id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<noscript><p style="padding:24px;text-align:center">本工具需要启用 JavaScript 才能读取收藏夹。</p></noscript>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/api-client.js"></script>
<script src="./js/bilibili-api.js"></script>
<script src="./js/store.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
